[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./broadcast" }]


remappings = [
  "@1inch/aqua/=lib/aqua/",
  "@1inch/solidity-utils/=lib/solidity-utils/",
  "@ensv2/contracts/=lib/ens-contracts-v2/contracts/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
