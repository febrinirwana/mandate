services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: mandate
      POSTGRES_USER: mandate
      POSTGRES_PASSWORD: mandate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mandate -d mandate"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mandate-postgres:/var/lib/postgresql/data

volumes:
  mandate-postgres:
